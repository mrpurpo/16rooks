<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.2" />
    </linearGradient>
  </defs>

  <rect width="400" height="250" rx="12" fill="url(#grad1)" stroke="#3b82f6" stroke-width="2" />
  
  <!-- Grid representation -->
  <g stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3">
    <line x1="80" y1="40" x2="80" y2="210" />
    <line x1="160" y1="40" x2="160" y2="210" />
    <line x1="240" y1="40" x2="240" y2="210" />
    <line x1="320" y1="40" x2="320" y2="210" />
    <line x1="50" y1="80" x2="350" y2="80" />
    <line x1="50" y1="125" x2="350" y2="125" />
    <line x1="50" y1="170" x2="350" y2="170" />
  </g>

  <!-- Rook piece markers -->
  <circle cx="80" cy="80" r="14" fill="#2563eb" />
  <text x="80" y="85" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">♜</text>

  <circle cx="160" cy="170" r="14" fill="#2563eb" />
  <text x="160" y="175" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">♜</text>

  <circle cx="240" cy="125" r="14" fill="#2563eb" />
  <text x="240" y="130" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">♜</text>

  <circle cx="320" cy="80" r="14" fill="#94a3b8" />
  <text x="320" y="85" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">✕</text>

  <text x="200" y="235" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="13" font-weight="500">Orthogonal Non-Attacking Rook Configuration</text>
</svg>

